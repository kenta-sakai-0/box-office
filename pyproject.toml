[project]
name = "box_office"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "dagster==1.13.3",
    "dagster-duckdb",
    "databricks-connect==18.1",
    "ipykernel>=7.2.0",
    "numpy>=2.2.6",
    "papermill>=2.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }
include = ["src/box_office/config.yaml"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "box_office"
registry_modules = [
    "box_office.components.*",
]


