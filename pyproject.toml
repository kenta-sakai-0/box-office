[project]
name = "box_office"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "dagster==1.13.3",
    "dagster-duckdb",
    "numpy>=2.2.6",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }
include = ["src/box_office/config.yaml"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "box_office"
registry_modules = [
    "box_office.components.*",
]


